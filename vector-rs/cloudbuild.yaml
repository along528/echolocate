# Cloud Build config for vector-rs. Runs from the repo root (the Dockerfile needs
# vector/ for the CLAP export and an index file to bake). Previews pass the small
# committed sample via _INDEX_SRC so the image stays tiny; production keeps using
# vector-rs/deploy.sh (local docker build with the full ~1.4GB data/index.duckdb).
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - vector-rs/Dockerfile
      - --build-arg
      - INDEX_SRC=${_INDEX_SRC}
      - -t
      - ${_IMAGE}
      - .
  - name: gcr.io/cloud-builders/docker
    args: [push, '${_IMAGE}']

images:
  - '${_IMAGE}'

substitutions:
  _IMAGE: gcr.io/cloud-crate-485418/cloud-crate-vector-rs:preview
  _INDEX_SRC: vector-rs/testdata/sample_index.duckdb

options:
  # The Rust release compile dominates build time; give it more cores.
  machineType: E2_HIGHCPU_8

timeout: 2400s
