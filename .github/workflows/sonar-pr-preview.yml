name: sonar-pr-preview

# Build the sonar frontend for a PR and publish it to a live Cloud Run preview URL
# (a --no-traffic tagged revision of the existing cloud-crate-sonar service). The
# preview points at the production vector-rs backend and is torn down by
# sonar-pr-cleanup.yml when the PR closes.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'sonar/**'
      - '.github/workflows/sonar-pr-preview.yml'

concurrency:
  group: sonar-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PROJECT_ID: cloud-crate-485418
  REGION: us-central1
  SERVICE: cloud-crate-sonar
  VECTOR_SERVICE: cloud-crate-vector-rs

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sonar/package-lock.json
      - name: Install + build
        working-directory: sonar
        run: |
          npm ci
          npm run build

  preview:
    needs: build-check
    runs-on: ubuntu-latest
    permissions:
      id-token: write        # mint the WIF OIDC token
      contents: read
      pull-requests: write   # post the preview-URL comment
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Resolve tags and backend URL
        id: vars
        run: |
          PR="${{ github.event.pull_request.number }}"
          SHA="$(echo "${{ github.event.pull_request.head.sha }}" | cut -c1-8)"
          VECTOR_URL="$(gcloud run services describe "$VECTOR_SERVICE" \
            --region "$REGION" --project "$PROJECT_ID" --format='value(status.url)')"
          if [ -z "$VECTOR_URL" ]; then
            echo "Could not resolve $VECTOR_SERVICE URL" >&2
            exit 1
          fi
          {
            echo "pr=$PR"
            echo "tag=pr${PR}"
            echo "image=gcr.io/${PROJECT_ID}/${SERVICE}:pr${PR}-${SHA}"
            echo "vector_url=$VECTOR_URL"
          } >> "$GITHUB_OUTPUT"

      - name: Build image (bakes VITE_VECTOR_API_URL)
        run: |
          gcloud builds submit sonar \
            --config sonar/cloudbuild.yaml \
            --project "$PROJECT_ID" \
            --substitutions "_IMAGE=${{ steps.vars.outputs.image }},_VITE_VECTOR_API_URL=${{ steps.vars.outputs.vector_url }}"

      - name: Deploy no-traffic preview revision
        id: deploy
        run: |
          gcloud run deploy "$SERVICE" \
            --image "${{ steps.vars.outputs.image }}" \
            --region "$REGION" --project "$PROJECT_ID" \
            --platform managed \
            --tag "${{ steps.vars.outputs.tag }}" \
            --no-traffic \
            --allow-unauthenticated \
            --quiet
          URL="$(gcloud run services describe "$SERVICE" \
            --region "$REGION" --project "$PROJECT_ID" --format=json \
            | jq -r --arg TAG "${{ steps.vars.outputs.tag }}" \
                '.status.traffic[] | select(.tag==$TAG) | .url' | head -1)"
          if [ -z "$URL" ]; then
            echo "Could not resolve preview URL for tag ${{ steps.vars.outputs.tag }}" >&2
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const url = "${{ steps.deploy.outputs.url }}";
            const marker = "<!-- sonar-preview -->";
            const body = `${marker}\n### 🔊 Sonar preview\n\n**${url}**\n\n` +
              `Serving this PR's build, pointed at the production vector-rs backend. ` +
              `Updates on every push; torn down when the PR closes.`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.data.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
