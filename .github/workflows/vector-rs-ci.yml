name: vector-rs-ci

# Compile + unit-test gate for vector-rs. There was previously no CI touching
# vector-rs; this ensures the service builds and its tests pass before a preview
# is deployed or code lands on main. Uses the same provisioning script the dev
# sandbox uses (scripts/setup-dev.sh), so CI and local dev stay in lockstep.

on:
  pull_request:
    paths:
      - 'vector-rs/**'
      - '.github/workflows/vector-rs-ci.yml'
  push:
    branches: [main]
    paths:
      - 'vector-rs/**'

concurrency:
  group: vector-rs-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vector-rs

      - name: Provision native deps (libduckdb, onnxruntime, vss)
        run: bash vector-rs/scripts/setup-dev.sh

      - name: Build + test
        working-directory: vector-rs
        run: |
          # shellcheck disable=SC1091
          source scripts/dev-env.sh
          cargo build --release
          cargo test
