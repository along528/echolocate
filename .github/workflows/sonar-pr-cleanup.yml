name: sonar-pr-cleanup

# Tear down a PR's sonar preview when the PR closes: remove the Cloud Run tag (which
# revokes the preview URL) and best-effort delete the preview image. The production
# serving revision is never touched.

on:
  pull_request:
    types: [closed]
    paths:
      - 'sonar/**'
      - '.github/workflows/sonar-pr-preview.yml'

env:
  PROJECT_ID: cloud-crate-485418
  REGION: us-central1
  SERVICE: cloud-crate-sonar

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Remove preview tag + image
        run: |
          TAG="pr${{ github.event.pull_request.number }}"
          # Remove the tag -> revokes the preview URL. Ignore if already gone.
          gcloud run services update-traffic "$SERVICE" \
            --region "$REGION" --project "$PROJECT_ID" \
            --remove-tags "$TAG" --quiet || true
          # Best-effort: delete the PR's image tags to reclaim registry storage.
          for DIGEST in $(gcloud container images list-tags "gcr.io/${PROJECT_ID}/${SERVICE}" \
              --filter="tags:${TAG}-*" --format='value(digest)' 2>/dev/null); do
            gcloud container images delete "gcr.io/${PROJECT_ID}/${SERVICE}@${DIGEST}" \
              --force-delete-tags --quiet || true
          done

      - name: Update preview comment
        uses: actions/github-script@v7
        with:
          script: |
            const marker = "<!-- sonar-preview -->";
            const body = `${marker}\n### 🔊 Sonar preview\n\n_Preview torn down (PR closed)._`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.data.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            }
