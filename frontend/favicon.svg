<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <g transform="translate(16, 12)">
    <ellipse cx="0" cy="0" rx="7" ry="6.5" fill="url(#g)"/>

    <!-- Ears pointing up -->
    <path d="M -4 -4 L -6.5 -11 L -2 -5.5 Z" fill="url(#g)"/>
    <path d="M 4 -4 L 6.5 -11 L 2 -5.5 Z" fill="url(#g)"/>

    <!-- Eyes -->
    <circle cx="-3" cy="-1" r="1.5" fill="#0a0a0f"/>
    <circle cx="3" cy="-1" r="1.5" fill="#0a0a0f"/>
    <circle cx="-2.5" cy="-1.5" r="0.5" fill="rgba(255,255,255,0.4)"/>
    <circle cx="3.5" cy="-1.5" r="0.5" fill="rgba(255,255,255,0.4)"/>

    <!-- Nose -->
    <circle cx="-0.8" cy="2.5" r="0.5" fill="#0a0a0f"/>
    <circle cx="0.8" cy="2.5" r="0.5" fill="#0a0a0f"/>

    <!-- Fangs -->
    <path d="M -1.5 4 L -1.2 6.5 L -0.5 4.2" fill="#f0f0f5" opacity="0.9"/>
    <path d="M 1.5 4 L 1.2 6.5 L 0.5 4.2" fill="#f0f0f5" opacity="0.9"/>
  </g>

  <!-- Sound waves below -->
  <path d="M 7 23 A 12 6 0 0 0 25 23" stroke="#eab308" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M 4 27 A 16 8 0 0 0 28 27" stroke="#eab308" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.35"/>
</svg>
