<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" fill="#0a0a0f" rx="6"/>
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <g transform="translate(16, 12)">
    <ellipse cx="0" cy="0" rx="7" ry="6.5" fill="url(#g)"/>

    <!-- Headphones behind ears (gold, hugging head) -->
    <path d="M -7.5 -1.5 C -8 -5.5 -5.5 -8 0 -8 C 5.5 -8 8 -5.5 7.5 -1.5" stroke="#eab308" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <ellipse cx="-8" cy="0" rx="2.2" ry="3.5" fill="#eab308"/>
    <ellipse cx="-8" cy="0" rx="1.5" ry="2.5" fill="#ca9a06"/>
    <ellipse cx="8" cy="0" rx="2.2" ry="3.5" fill="#eab308"/>
    <ellipse cx="8" cy="0" rx="1.5" ry="2.5" fill="#ca9a06"/>

    <!-- Ears pointing up (in front of headphones) -->
    <path d="M -4 -4 L -6.5 -11 L -2 -5.5 Z" fill="url(#g)"/>
    <path d="M 4 -4 L 6.5 -11 L 2 -5.5 Z" fill="url(#g)"/>

    <!-- Eyes -->
    <ellipse cx="-3" cy="-1" rx="1.5" ry="1.7" fill="#0a0a0f"/>
    <ellipse cx="3" cy="-1" rx="1.5" ry="1.7" fill="#0a0a0f"/>
    <circle cx="-2.7" cy="-0.7" r="0.7" fill="#6366f1" opacity="0.6"/>
    <circle cx="3.3" cy="-0.7" r="0.7" fill="#6366f1" opacity="0.6"/>
    <circle cx="-2.3" cy="-1.5" r="0.4" fill="rgba(255,255,255,0.5)"/>
    <circle cx="3.7" cy="-1.5" r="0.4" fill="rgba(255,255,255,0.5)"/>

    <!-- Nose -->
    <circle cx="-0.8" cy="2" r="0.6" fill="#1a1a25"/>
    <circle cx="0.8" cy="2" r="0.6" fill="#1a1a25"/>

    <!-- Mouth -->
    <path d="M -2 3.5 Q 0 5 2 3.5" stroke="#1a1a25" stroke-width="0.6" fill="none"/>

    <!-- Fangs -->
    <path d="M -1.5 3.5 L -1.2 6 L -0.5 3.8" fill="#f0f0f5" opacity="0.9"/>
    <path d="M 1.5 3.5 L 1.2 6 L 0.5 3.8" fill="#f0f0f5" opacity="0.9"/>
  </g>

  <!-- Sound waves below -->
  <path d="M 7 23 A 12 6 0 0 0 25 23" stroke="#eab308" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M 4 27 A 16 8 0 0 0 28 27" stroke="#eab308" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.35"/>
</svg>
