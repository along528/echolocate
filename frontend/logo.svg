<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" fill="none">
  <rect width="100" height="120" fill="#0a0a0f" rx="8"/>
  <defs>
    <linearGradient id="batGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <g transform="translate(50, 42) scale(1.5)">
    <!-- Head -->
    <ellipse cx="0" cy="0" rx="20" ry="18" fill="url(#batGrad)"/>

    <!-- Ears pointing UP -->
    <path d="M -12 -12 L -18 -30 L -6 -16 Z" fill="url(#batGrad)"/>
    <path d="M 12 -12 L 18 -30 L 6 -16 Z" fill="url(#batGrad)"/>
    <!-- Inner ears -->
    <path d="M -11 -14 L -15 -26 L -7 -16 Z" fill="#4f46e5" opacity="0.4"/>
    <path d="M 11 -14 L 15 -26 L 7 -16 Z" fill="#4f46e5" opacity="0.4"/>

    <!-- Nose -->
    <circle cx="-2" cy="6" r="1.2" fill="#0a0a0f"/>
    <circle cx="2" cy="6" r="1.2" fill="#0a0a0f"/>

    <!-- Eyes -->
    <ellipse cx="-8" cy="-2" rx="4" ry="4.5" fill="#0a0a0f"/>
    <ellipse cx="8" cy="-2" rx="4" ry="4.5" fill="#0a0a0f"/>
    <!-- Pupils -->
    <circle cx="-7" cy="-1" r="2" fill="#6366f1" opacity="0.6"/>
    <circle cx="9" cy="-1" r="2" fill="#6366f1" opacity="0.6"/>
    <!-- Eye shine -->
    <circle cx="-6" cy="-3" r="1" fill="rgba(255,255,255,0.5)"/>
    <circle cx="10" cy="-3" r="1" fill="rgba(255,255,255,0.5)"/>

    <!-- Mouth -->
    <path d="M -5 10 Q 0 14 5 10" stroke="#0a0a0f" stroke-width="1.2" fill="none"/>

    <!-- Fangs -->
    <path d="M -4 10 L -3.5 16 L -2.5 10.5" fill="#f0f0f5" opacity="0.9"/>
    <path d="M 4 10 L 3.5 16 L 2.5 10.5" fill="#f0f0f5" opacity="0.9"/>
  </g>

  <!-- Sound waves below -->
  <path d="M 32 76 A 26 14 0 0 0 68 76" stroke="#eab308" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M 24 88 A 38 18 0 0 0 76 88" stroke="#eab308" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.4"/>
  <path d="M 16 100 A 50 22 0 0 0 84 100" stroke="#eab308" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.22"/>
</svg>
